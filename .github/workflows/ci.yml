# yamllint disable rule:line-length
# yamllint disable rule:truthy
name: Continuous integration

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Node ${{ matrix.node-version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24, 26]
    env:
      NPM_CONFIG_AUDIT: 'false'
      NPM_CONFIG_FUND: 'false'
      NPM_CONFIG_IGNORE_SCRIPTS: 'true'
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Pin npm
        # npm is the package manager under test and is pinned outside its own lockfile.
        # zizmor: ignore[adhoc-packages]
        run: npm install --global npm@12.0.2 --ignore-scripts --no-audit --no-fund

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Run the complete quality contract
        run: npm run check

      - name: Record exact build source
        if: matrix.node-version == 24
        env:
          REQUESTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          REQUESTED_BASE: ${{ github.event.pull_request.base.sha || github.sha }}
        run: |
          node --input-type=module <<'NODE'
          import { execFileSync } from 'node:child_process';
          import { writeFileSync } from 'node:fs';
          const git = (...args) => execFileSync('git', args, { encoding: 'utf8' }).trim();
          const receipt = {
            requested_head: process.env.REQUESTED_HEAD,
            requested_base: process.env.REQUESTED_BASE,
            checkout_commit: git('rev-parse', 'HEAD'),
            checkout_tree: git('rev-parse', 'HEAD^{tree}'),
            workflow_run: process.env.GITHUB_RUN_ID,
            node: process.version,
            npm: execFileSync('npm', ['--version'], { encoding: 'utf8' }).trim(),
          };
          writeFileSync('build-source-receipt.json', `${JSON.stringify(receipt, null, 2)}\n`);
          NODE

      - name: Preserve the verified static build
        if: matrix.node-version == 24
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: portal-build-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            dist/
            build-source-receipt.json
          if-no-files-found: error
          retention-days: 7

  windows:
    name: Windows contract
    runs-on: windows-2025
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      NPM_CONFIG_AUDIT: 'false'
      NPM_CONFIG_FUND: 'false'
      NPM_CONFIG_IGNORE_SCRIPTS: 'true'
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Pin npm
        # zizmor: ignore[adhoc-packages]
        run: npm install --global npm@12.0.2 --ignore-scripts --no-audit --no-fund

      - name: Install and validate
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run check

  supply-chain:
    name: Dependency and SBOM contract
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      NPM_CONFIG_AUDIT: 'false'
      NPM_CONFIG_FUND: 'false'
      NPM_CONFIG_IGNORE_SCRIPTS: 'true'
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Pin npm
        # zizmor: ignore[adhoc-packages]
        run: npm install --global npm@12.0.2 --ignore-scripts --no-audit --no-fund

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Fail on high-severity advisories
        run: npm audit --audit-level=high

      - name: Generate and parse a CycloneDX SBOM
        run: |
          npm sbom --sbom-format cyclonedx > nymrel-ecosystem-portal.cdx.json
          node -e "const fs=require('node:fs'); const sbom=JSON.parse(fs.readFileSync('nymrel-ecosystem-portal.cdx.json','utf8')); if(sbom.bomFormat!=='CycloneDX'||!Array.isArray(sbom.components)) process.exit(1)"
