# yamllint disable rule:line-length
# yamllint disable rule:truthy
name: Continuous integration

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Node ${{ matrix.node-version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24, 26]
    env:
      NPM_CONFIG_AUDIT: 'false'
      NPM_CONFIG_FUND: 'false'
      NPM_CONFIG_IGNORE_SCRIPTS: 'true'
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Pin npm
        # npm is the package manager under test and is pinned outside its own lockfile.
        # zizmor: ignore[adhoc-packages]
        run: npm install --global npm@12.0.2 --ignore-scripts --no-audit --no-fund

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Run the complete quality contract
        run: npm run check

  windows:
    name: Windows contract
    runs-on: windows-2025
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      NPM_CONFIG_AUDIT: 'false'
      NPM_CONFIG_FUND: 'false'
      NPM_CONFIG_IGNORE_SCRIPTS: 'true'
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Pin npm
        # zizmor: ignore[adhoc-packages]
        run: npm install --global npm@12.0.2 --ignore-scripts --no-audit --no-fund

      - name: Install and validate
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run check

  supply-chain:
    name: Dependency and SBOM contract
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      NPM_CONFIG_AUDIT: 'false'
      NPM_CONFIG_FUND: 'false'
      NPM_CONFIG_IGNORE_SCRIPTS: 'true'
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Pin npm
        # zizmor: ignore[adhoc-packages]
        run: npm install --global npm@12.0.2 --ignore-scripts --no-audit --no-fund

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Fail on high-severity advisories
        run: npm audit --audit-level=high

      - name: Generate and parse a CycloneDX SBOM
        run: |
          npm sbom --sbom-format cyclonedx > nymrel-ecosystem-portal.cdx.json
          node -e "const fs=require('node:fs'); const sbom=JSON.parse(fs.readFileSync('nymrel-ecosystem-portal.cdx.json','utf8')); if(sbom.bomFormat!=='CycloneDX'||!Array.isArray(sbom.components)) process.exit(1)"
